{{define "components/availability-alert"}}
<div
    class="animate-pop-in fill-mode-backwards inline-flex max-w-full items-center gap-2.5 rounded-2xl sm:rounded-full border border-emerald-400/30 bg-emerald-400/10 px-3 py-1.5 font-mono text-xs font-semibold text-emerald-300 backdrop-blur-sm"
    role="status"
    style="animation-delay: 400ms">
    <span
        class="relative flex h-2 w-2"
        aria-hidden="true">
        <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-400"></span>
    </span>
    <span>
        Beschikbaar voor
        <strong>freelance</strong>
        projecten
        <strong class="whitespace-nowrap">({{.AvailableForWorkQ}})</strong>
    </span>
</div>
{{end}}
