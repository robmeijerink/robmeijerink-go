{{define "components/availability-alert"}}
<div
    class="animate-pop-in fill-mode-backwards inline-flex items-center gap-2.5 rounded-2xl sm:rounded-full border border-emerald-300 bg-emerald-100 px-3 py-1.5 text-sm font-bold text-emerald-800 shadow-md ring-1 ring-emerald-600/20 backdrop-blur-sm ring-inset"
    role="status"
    style="animation-delay: 400ms">
    <span
        class="relative flex h-2 w-2"
        aria-hidden="true">
        <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"></span>
    </span>
    <span>
        Beschikbaar voor
        <strong>freelance</strong>
        projecten
        <strong class="whitespace-nowrap">({{.AvailableForWorkQ}})</strong>
    </span>
</div>
{{end}}
