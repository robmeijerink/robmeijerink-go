{{define "components/topbar"}}
<header class="topbar sticky top-0 z-40" data-topbar>
    <div class="wrap flex flex-wrap items-center justify-between gap-x-8 gap-y-3 py-4">
        <a href="/" class="focus-ring flex items-baseline gap-0.5 text-lg font-extrabold tracking-tighter text-slate-100" title="Rob Meijerink | Software Developer & B2B Tech Partner">
            Rob<span class="text-brand-sky">Meijerink</span>. <span class="text-xs font-medium text-slate-500">NL</span>
        </a>

        <nav class="flex items-center gap-7 overflow-x-auto py-1 text-sm font-medium" aria-label="Hoofdnavigatie">
            {{ if eq .Path "/" }}
            <div class="pipeline">
                <a href="#werkwijze" class="nav-link focus-ring" data-section-link="werkwijze">Werkwijze</a>
                <a href="#rust-go" class="nav-link focus-ring" data-section-link="rust-go">Rust &amp; Go</a>
                <a href="#faq" class="nav-link focus-ring" data-section-link="faq">FAQ</a>
                <a href="#samenwerking" class="nav-link focus-ring" data-section-link="samenwerking">Samenwerking</a>
            </div>
            <span class="h-4 w-px shrink-0 bg-ink-line" aria-hidden="true"></span>
            {{ end }}
            {{ template "components/page-links" . }}
        </nav>
    </div>
    <div class="scroll-progress" aria-hidden="true"></div>
</header>
{{end}}
