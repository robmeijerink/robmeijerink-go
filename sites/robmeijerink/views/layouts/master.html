<!DOCTYPE html>
<html lang="nl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{or .Title "Rob Meijerink | Freelance Senior Software & DevOps Engineer"}}</title>
    <meta name="description" content="{{or .MetaDescription "Freelance Senior Software & DevOps Engineer. Gespecialiseerd in schaalbare backends (Go/PHP), cloud-architectuur en robuuste DevOps automatisering."}}">
    <meta name="author" content="Rob Meijerink">
    {{if .Keywords}}
    <meta name="keywords" content="{{.Keywords}}">
    {{end}}

    {{if .CanonicalHost}}
    <link rel="canonical" href="https://{{ .CanonicalHost }}{{ .Path }}">
    {{end}}
    <meta name="robots" content="index, follow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    {{ if .IsProd }}
    <link rel="stylesheet" href="{{ .Vite.Css "src/scripts/app.js" }}">
    <script type="module" src="{{ .Vite.Asset "src/scripts/app.js" }}"></script>
    {{ else }}
    <script type="module" src="http://localhost:5173/@vite/client"></script>
    <script type="module" src="http://localhost:5173/src/scripts/app.js"></script>
    {{ end }}
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-brand-blue selection:text-white relative overflow-x-hidden">

    <div class="pointer-events-none fixed inset-y-0 left-0 z-5 flex w-48 sm:w-80">
    <div class="h-full w-px bg-brand-blue/30"></div>

    <div class="h-full w-full bg-linear-to-r from-brand-blue/15 to-transparent"></div>
</div>

    <div class="pointer-events-none fixed -top-40 -right-40 z-1 h-200 w-200 rounded-full bg-brand-blue/15 blur-[120px]" aria-hidden="true"></div>

    <main class="relative z-10 min-h-screen flex flex-col items-center px-6 sm:px-12">
        <header class="w-full max-w-5xl mx-auto flex items-center justify-between py-8 relative z-20">
            <a href="/" class="group flex items-baseline gap-0.5 text-xl font-extrabold tracking-tighter text-slate-900 transition-all" title="Naar Homepage">
                Rob<span class="text-brand-blue group-hover:text-brand-blue transition-colors">Meijerink</span>. <span class="text-slate-500 text-sm">NL</span>
            </a>
            <nav class="flex items-center gap-8 text-sm font-semibold">
                {{ if eq .Path "/" }}
                <a href="/expertise" class="text-slate-500 transition-colors hover:text-slate-900" title="Bekijk een overzicht van mijn expertise">Expertise</a>
                {{ else }}
                <a href="/" class="text-slate-500 transition-colors hover:text-slate-900" title="Bekijk mijn ICT diensten op de Home">Home</a>
                {{ end }}
                <!-- <a href="/blog" class="text-slate-500 transition-colors hover:text-slate-900">Blog</a> -->
            </nav>
        </header>

        <div class="w-full max-w-5xl pb-16 sm:pb-24">
            <div class="space-y-24">
                {{embed}}
            </div>

            <footer class="mt-12 flex flex-col items-center gap-6 border-t border-slate-200/60 pt-8 pb-28 text-xs font-medium tracking-wider text-slate-400 sm:flex-row sm:justify-between sm:pb-8">

                <p class="text-center sm:text-left">&copy; {{.CurrentYear}} - Rob Meijerink <span class="text-brand-blue">| Solvalutions</span></p>

                <div class="flex items-center gap-6">
                    <a href="https://linkedin.com/in/robm89" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1.5 text-slate-400 transition-colors hover:text-slate-600" title="Connect met mij op LinkedIn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" class="text-brand-blue"></path>
                            <rect x="2" y="9" width="4" height="12"></rect>
                            <circle cx="4" cy="4" r="2"></circle>
                        </svg>
                        <span class="text-brand-blue">LinkedIn</span>
                    </a>

                    <a href="https://github.com/robmeijerink"
target="_blank" rel="noopener noreferrer"
                       title="Check mijn werk op GitHub!"
                       class="group hover:border-brand-blue hover:text-brand-blue hover:shadow-brand-blue/30 flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-slate-500 shadow-sm transition-all duration-300 ease-out hover:-translate-y-1 hover:shadow-2xl">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                        </svg>
                        <span class="font-bold">GitHub</span>
                    </a>
                </div>
            </footer>
        </div>
    </main>
    <a href="https://wa.me/+31649691374"
       target="_blank"
       rel="noopener noreferrer"
       title="Contact via WhatsApp"
       class="fixed bottom-8 right-8 z-40 flex h-14 w-14 items-center justify-center rounded-full bg-[#25D366] text-white shadow-lg transition-all duration-300 hover:-translate-y-1 hover:bg-[#20ba5a] hover:shadow-xl focus:outline-hidden focus:ring-2 focus:ring-[#25D366] focus:ring-offset-2"
       aria-label="Contact via WhatsApp">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
    </a>
</body>
</html>
