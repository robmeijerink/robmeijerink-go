runtime: go126
instance_class: F1

env_variables:
  APP_ENV: "production"

# Costs saving
automatic_scaling:
  target_cpu_utilization: 0.6
  max_instances: 1
  min_pending_latency: 30ms

handlers:
  # 1. Vite Assets - RobMeijerink
  - url: /assets/rob
    static_dir: sites/robmeijerink/public/dist
    expiration: "365d"
    http_headers:
      Vary: Accept-Encoding
      Cache-Control: "public, max-age=31536000, immutable"
      Strict-Transport-Security: "max-age=31536000; includeSubDomains"
      X-Content-Type-Options: nosniff

  # 2. Vite Assets - Solvalutions
  - url: /assets/sol
    static_dir: sites/solvalutions/public/dist
    expiration: "365d"
    http_headers:
      Vary: Accept-Encoding
      Cache-Control: "public, max-age=31536000, immutable"
      Strict-Transport-Security: "max-age=31536000; includeSubDomains"
      X-Content-Type-Options: nosniff

  # 3. Send the rest to the Go (Fiber) binary
  - url: /.*
    script: auto
    secure: always
